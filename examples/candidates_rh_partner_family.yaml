# Reproduces examples_legacy/rh_partner_quartet_family.py: for each even
# n (odd n have zero coupling by the equatorial-symmetry selection rule),
# builds the quartet RH(4,5)+RH(1,2)+RH(3,4)+RH(3,n) and reports P-measure
# for target RH(3,n) -- how much the fixed partner RH(3,4) enhances or
# inhibits RH(3,n)'s own energy capture, relative to RH(3,n) captured in
# isolation. quartet_rh_preference is already this exact base quartet
# (a=RH(4,5), b=RH(1,2), c=RH(3,4) at rest, driving pair at 40 m/s) with
# slot d free -- no new registry entry needed.
base_wave_set: quartet_rh_preference
specs_path: wave_sets_default.yaml
candidate_slot: d
target_mode: d
candidates:
  - {m: 3, n: 6, alpha: 3}
  - {m: 3, n: 8, alpha: 3}
  - {m: 3, n: 10, alpha: 3}
  - {m: 3, n: 12, alpha: 3}
  - {m: 3, n: 14, alpha: 3}
  - {m: 3, n: 16, alpha: 3}
diagnostics: [p_measure]
tf_days: 240.0
h: 0.01
table: outputs/tables/rh_partner_family_candidates.csv
