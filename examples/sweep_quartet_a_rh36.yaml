# Quartet A (RH(3,6) driven) precession-frequency + efficiency sweep --
# run_sweep.py's `precession` diagnostic. Migrated from
# examples/precession_sweep_figures.yaml's `quartet_a_rh36` entry (see
# examples/legacy/precession_sweep_figure.py, superseded by this config +
# run_sweep.py + rsw_sphere/plotting/wave_set_precession.py).
wave_set: quartet_rh_preference
sweep:
  axes: [{mode: d, min: 10.0, max: 150.0}]
  n_grid: 45
  diagnostics: [precession]
target_mode: c   # RH(3,4): the target triad's own private, undriven member
plot_triad: 0     # only plot triad 0 (RH(4,5)+RH(1,2)+RH(3,4)): the target
                   # triad, whose own lock is this figure's subject -- triad 1
                   # (containing the swept mode d) locks trivially onto its
                   # own forcing and is not plotted (still computed/cached).
tf_days: 150.0
plot:
  xlabel: "RH(3,6) driving velocity $u$ (m/s)"
  title: "Quartet A (this paper)"
  plot_u_max: 120.0  # crop the plotted range below the sweep's own u_max=150:
                      # excludes the narrow u~137 frequency dip (a single-point
                      # zero-crossing, not a sustained lock) so the figure
                      # shows only the one genuine, sustained lock.
output: outputs/figures/quartet_a_rh36_precession.png
