# Registry of resonant-triad examples used in paper §2.2 ("Resonant
# Triads") / dissertation §2.3.1. Loaded by
# rsw_sphere.dynamics.triad_specs.load_triad_specs() into TriadSpec
# objects, which feed rsw-triad-table, rsw-triad and rsw-triad-efficiency
# so the numbers reported in text, tables and figures cannot drift apart
# from one another.
#
# Schema follows the other example configs (table_2_1_quasi_resonant.yaml,
# table_2_3_kelvin_rh_energy_flow.yaml, configs.yaml): one `Triad:` block
# per entry with mode_a/mode_b/mode_c (m, n, alpha, u), plus h_e.
#
# Keys are semantic *role* labels, not mode numbers -- these triads are
# reused as building blocks in later paper sections (Multiple Triads,
# Five-Wave), so naming a key after only one of the three modes (e.g. the
# old `rh-34`, `kelvin`, `catalyst`) would not scale.
#
# alpha convention (shared with rsw_sphere.hough_harmonics):
# 1 = EIG/EG (eastward inertia-gravity), 2 = WIG/WG (westward
# inertia-gravity), 3 = RH (Rossby-Haurwitz).
#
# `label` is the human-readable name for figure/table captions; `display_label`
# is the short "Triad A/B/C/D" tag used as the leftmost-column header in the
# master table (rsw_sphere.plotting.triad_table) and in figure titles; `role`
# is a one-line free-text note on why this triad is included.
#
# Velocity ranges (paper review, 2026-08-11): Rossby (RH) mode initial
# velocities/sweep bounds go up to 100 m/s (jet-stream-strength winds, cf.
# Williamson et al. 1992 test-case-6 benchmark ~50 m/s); gravity (EG/WG)
# mode velocities are capped at 50 m/s (observed Kelvin/inertia-gravity
# wind anomalies are ~few-20 m/s, so the previously-used 80-200 m/s values
# were unrealistic). The velocities below respect that cap; sweep-range
# caps are enforced in code (see triad_efficiency.efficiency_sweep's
# mode-family-aware default ranges).
#
# Forward-looking note (not solved here): when Multiple-Triads/Five-Wave
# configs are built, they should be able to reference a triad here by its
# role key and extend it with additional modes, rather than re-listing
# shared modes.

triad_rossby_only_near_resonant:
  label: "Rossby-only, near-resonant, long period"
  display_label: "Triad A"
  role: "Rossby-only, near-resonant, long period"
  h_e: 10000
  mode_a:
    m: 3
    n: 10
    alpha: 3        # RH
    u: 0.0
  mode_b:
    m: 1
    n: 2
    alpha: 3        # RH
    u: 58.0
  mode_c:
    m: 4
    n: 5
    alpha: 3        # RH
    u: 100.0

triad_rossby_only_non_resonant:
  label: "Rossby-only, non-resonant, short period"
  display_label: "Triad B"
  role: "Rossby-only, non-resonant, short period"
  h_e: 10000
  mode_a:
    m: 3
    n: 4
    alpha: 3        # RH
    u: 0.0
  mode_b:
    m: 1
    n: 2
    alpha: 3        # RH
    u: 58.0
  mode_c:
    m: 4
    n: 5
    alpha: 3        # RH
    u: 100.0

triad_kelvin_rossby_flow:
  label: "RH <-> EG flow via the Kelvin wave"
  display_label: "Triad C"
  role: >-
    RH<->EG flow; reused in the Inertia-Gravity Waves section. Has two
    worked target-mode examples: target=EG(1,1) (RH->EG) and
    target=RH(3,4) (EG->RH, the pump mode) -- see
    examples/make_section22_figures.py --target.
  h_e: 10000
  mode_a:
    m: 1
    n: 1
    alpha: 1        # EIG (Kelvin wave)
    u: 50.0
  mode_b:
    m: 3
    n: 4
    alpha: 3        # RH
    u: 63.89
  mode_c:
    m: 4
    n: 5
    alpha: 3        # RH
    u: 100.0

triad_gravity_with_rossby_catalyst:
  label: "EG <-> EG with RH catalyst"
  display_label: "Triad D"
  role: >-
    EG<->EG with RH catalyst; ~200x scale separation. The catalyst role is
    played by the Rossby mode RH(1,7) (small coupling coefficient, sets the
    exchange period without absorbing energy), while EG(6,9)/EG(7,9) are
    the pair actually exchanging energy.
  h_e: 10000
  mode_a:
    m: 6
    n: 9
    alpha: 1        # EIG
    u: 50.0
  mode_b:
    m: 1
    n: 7
    alpha: 3        # RH
    u: 20.0
  mode_c:
    m: 7
    n: 9
    alpha: 1        # EIG
    u: 0.0
