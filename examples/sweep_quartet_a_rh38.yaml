# RH(3,8) variant of Quartet A -- run_sweep.py's `precession` diagnostic.
# Migrated from examples/precession_sweep_figures.yaml's `quartet_a_rh38`
# entry (see examples/legacy/precession_sweep_figure.py, superseded by
# this config + run_sweep.py + rsw_sphere/plotting/wave_set_precession.py).
wave_set: quartet_rh_alt_partner
diagnostic: precession
sweep:
  mode: d
  values: {min: 10.0, max: 150.0, n: 30}
target_mode: c
plot_triad: 0
tf_days: 150.0
plot:
  xlabel: "RH(3,8) driving velocity $u$ (m/s)"
  title: "RH(3,8) variant (this paper)"
output: outputs/figures/quartet_a_rh38_precession.png
