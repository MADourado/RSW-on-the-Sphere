# Registry of quartet/quintet examples loaded by
# rsw_sphere.dynamics.wave_set_specs.load_wave_set_specs() into
# WaveSetSpec objects
#
#
# alpha convention : 
# 1 = EIG/EG (eastward inertia-gravity),
# 2 = WIG/WG (westward inertia-gravity), 
# 3 = RH (Rossby-Haurwitz).
#
# Mode keys follows:
# 'a' is always a triad's "sum" mode, m_a = m_b + m_c (and, for a quartet,
# also m_a = m_b + m_d -- both constituent triads share the sum mode).
# Validated at load: m_sum == m_p + m_q for every triad.
#
# Velocity caps: Rossby (RH) mode velocities up to
# 100 m/s; gravity (EG/WG) mode velocities up to 50 m/s. 
#
triad_near_zero_coupling:
  label: "Quasi-resonant, near-zero coupling coefficient"
  display_label: "Triad near zero coupling"
  role: >-
    Tthe coupling coefficient is close to
    zero and the frequency mismatch is tiny (~1e-4-1e-5), so
    run_dynamics.py should show almost no energy exchange between the
    three modes -- a sanity check that TRIAD's coupling coefficient
    correctly comes out near-zero for these mode triples.
  h_e: 10000
  modes:
    a: {m: 4, n: 7, alpha: 1, u: 25.0}
    b: {m: 1, n: 6, alpha: 3, u: 25.0}
    c: {m: 3, n: 7, alpha: 1, u: 25.0}
  triads:
    - {sum: a, members: [b, c], display_label: "Triad 1", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 10
    h: 0.001

triad_kelvin_gravity_energy_flow:
  label: "RH -> EG energy flow via the Kelvin wave "
  display_label: "Triad RH->EG via Kelvin"
  role: >-
    Energy flow from
    Rossby-Haurwitz to eastward gravity modes, via the Kelvin wave
    (1,1,EIG). Same topology as triad_kelvin_rossby_flow, different
    (published) driving velocity for the Kelvin mode.
  h_e: 10000
  modes:
    a: {m: 4, n: 5, alpha: 3, u: 100.0}
    b: {m: 1, n: 1, alpha: 1, u: 80.0}
    c: {m: 3, n: 4, alpha: 3, u: 63.89}
  triads:
    - {sum: a, members: [b, c], display_label: "Triad 1", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 10
    h: 0.001

triad_rossby_only_near_resonant:
  label: "Rossby-only, near-resonant, long period"
  display_label: "Triad A"
  role: "Rossby-only, near-resonant, long period"
  h_e: 10000
  modes:
    a: {m: 4, n: 5, alpha: 3, u: 100.0}
    b: {m: 3, n: 10, alpha: 3, u: 0.0}
    c: {m: 1, n: 2, alpha: 3, u: 58.0}
  triads:
    - {sum: a, members: [b, c], display_label: "Triad 1", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 200
    h: 0.01

triad_rossby_only_non_resonant:
  label: "Rossby-only, non-resonant, short period"
  display_label: "Triad B"
  role: "Rossby-only, non-resonant, short period"
  h_e: 10000
  modes:
    a: {m: 4, n: 5, alpha: 3, u: 100.0}
    b: {m: 3, n: 4, alpha: 3, u: 0.0}
    c: {m: 1, n: 2, alpha: 3, u: 58.0}
  triads:
    - {sum: a, members: [b, c], display_label: "Triad 1", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 15
    h: 0.01

triad_kelvin_rossby_flow:
  label: "RH <-> EG flow via the Kelvin wave"
  display_label: "Triad C"
  role: >-
    RH<->EG flow. Has two worked target-mode examples: target=EG(1,1)
    (RH->EG) and target=RH(3,4) (EG->RH, the pump mode).
  h_e: 10000
  modes:
    a: {m: 4, n: 5, alpha: 3, u: 100.0}
    b: {m: 1, n: 1, alpha: 1, u: 50.0}
    c: {m: 3, n: 4, alpha: 3, u: 63.89}
  triads:
    - {sum: a, members: [b, c], display_label: "Triad 1", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 20
    h: 0.01

triad_gravity_with_rossby_catalyst:
  label: "EG <-> EG with RH catalyst"
  display_label: "Triad D"
  role: >-
    EG<->EG with RH catalyst. The catalyst role is
    played by the Rossby mode RH(1,7) (small coupling coefficient, sets the
    exchange period without absorbing energy), while EG(6,9)/EG(7,9) are
    the pair actually exchanging energy.
  h_e: 10000
  modes:
    a: {m: 7, n: 9, alpha: 1, u: 0.0}
    b: {m: 6, n: 9, alpha: 1, u: 50.0}
    c: {m: 1, n: 7, alpha: 3, u: 20.0}
  triads:
    - {sum: a, members: [b, c], display_label: "Triad 1", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 60
    h: 0.01

quartet_rh_preference:
  label: "RH(1,2)+RH(4,5) choosing between RH(3,4) and RH(3,6)"
  display_label: "Quartet A"
  role: >-
    All-Rossby quartet: tests whether
    RH(4,5)+RH(1,2) prefer to exchange energy with RH(3,4) or RH(3,6).
  h_e: 10000
  modes:
    a: {m: 4, n: 5, alpha: 3, u: 40.0}
    b: {m: 1, n: 2, alpha: 3, u: 40.0}
    c: {m: 3, n: 4, alpha: 3, u: 0.0}
    d: {m: 3, n: 6, alpha: 3, u: 0.0}
  triads:
    - {sum: a, members: [b, c], display_label: "Triad 1", triad_key: null}
    - {sum: a, members: [b, d], display_label: "Triad 2", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 30
    h: 0.01
  sweep:
    axes: [{mode: d, min: 10.0, max: 150.0}]
    n_grid: 45
    diagnostics: [precession]
  target_mode: c
  plot_triad: 0
  tf_days: 150.0
  plot:
    xlabel: "RH(3,6) driving velocity $u$ (m/s)"
    title: "Quartet A (this paper)"
    plot_u_max: 120.0
  output: outputs/figures/wave_sets/quartet_rh_preference/precession.png

quartet_rh_alt_partner:
  label: "RH(1,2)+RH(4,5) with RH(3,4) and RH(3,8)"
  display_label: "Quartet A with RH(3,8) instead of RH(3,6)"   
  role: >-
    Second all-Rossby quartet on the same shared edge as quartet_rh_preference
    (RH(4,5)+RH(1,2)), with RH(3,6) replaced by RH(3,8) -- the other
    well-coupled member of the RH(3,n) family.
  h_e: 10000
  modes:
    a: {m: 4, n: 5, alpha: 3, u: 40.0}
    b: {m: 1, n: 2, alpha: 3, u: 40.0}
    c: {m: 3, n: 4, alpha: 3, u: 0.0}
    d: {m: 3, n: 8, alpha: 3, u: 0.0}
  triads:
    - {sum: a, members: [b, c], display_label: "Triad 1", triad_key: null}
    - {sum: a, members: [b, d], display_label: "Triad 2", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 30
    h: 0.01
  sweep:
    axes: [{mode: d, min: 10.0, max: 150.0}]
    n_grid: 30
    diagnostics: [precession]
  target_mode: c
  plot_triad: 0
  tf_days: 150.0
  plot:
    xlabel: "RH(3,8) driving velocity $u$ (m/s)"
    title: "RH(3,8) variant (this paper)"
  output: outputs/figures/wave_sets/quartet_rh_alt_partner/precession.png

quartet_rh_borrowed_topology:
  label: "RH(1,3)+RH(3,7) edge (Raphaldini et al. 2022's own topology) with target RH(2,9)"
  display_label: "Quartet B"
  role: >-
    All-Rossby quartet reproducing Raphaldini et al. (2022)'s own
    barotropic-vorticity precession-resonance topology, used for the
    barotropic-vs-RSW comparison (sec: quartet_rh_precession). Velocities
    follow quartet_rh_preference's own pattern: shared edge (b, c) driven
    at 40 m/s, sum mode a and target mode d at rest.
  h_e: 10000
  modes:
    a: {m: 4, n: 5, alpha: 3, u: 0.0}
    b: {m: 1, n: 3, alpha: 3, u: 40.0}
    c: {m: 3, n: 7, alpha: 3, u: 40.0}
    d: {m: 2, n: 9, alpha: 3, u: 0.0}
  triads:
    - {sum: a, members: [b, c], display_label: "Triad 1", triad_key: null}
    - {sum: c, members: [b, d], display_label: "Triad 2 (with RH(2,9))", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 30
    h: 0.01

quartet_rossby_kelvin:
  label: "RH(4,5)+RH(3,4)+RH(1,2) with the Kelvin mode EG(1,1)"
  display_label: "Quartet C"
  role: >-
    Rossby triad coupled with Kelvin mode. Tests how the gravity mode
    changes the RH-only triad's dynamics.
  h_e: 10000
  modes:
    a: {m: 4, n: 5, alpha: 3, u: 30.0}
    b: {m: 3, n: 4, alpha: 3, u: 30.0}
    c: {m: 1, n: 2, alpha: 3, u: 30.0}
    d: {m: 1, n: 1, alpha: 1, u: 30.0}
  triads:
    - {sum: a, members: [b, c], display_label: "Triad 1 (RH-only)", triad_key: null}
    - {sum: a, members: [b, d], display_label: "Triad 2 (with EG(1,1))", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 20
    h: 0.01
  sweep:
    axes: [{mode: c, min: 0.0, max: 100.0}, {mode: d, min: 0.0, max: 50.0}]
    n_grid: 10
    diagnostics: [p_measure]
  plot:
    title: "Quartet C -- draft analysis panel"
  output: outputs/figures/wave_sets/quartet_rossby_kelvin/diagnostics.png

quartet_gravity_79:
  label: "RH(4,5)+RH(3,4)+RH(1,2) + gravity mode EG(7,9)"
  display_label: "Quartet D"
  role: >-
    Rossby triad coupled with gravity mode. Tests how the gravity mode
    changes the RH-only triad's dynamics.
  h_e: 10000
  modes:
    a: {m: 4, n: 5, alpha: 3, u: 30.0}
    b: {m: 3, n: 4, alpha: 3, u: 30.0}
    c: {m: 1, n: 2, alpha: 3, u: 30.0}
    d: {m: 7, n: 9, alpha: 1, u: 0.0}
  triads:
    - {sum: a, members: [b, c], display_label: "Triad 1 (RH-only)", triad_key: null}
    - {sum: d, members: [a, b], display_label: "Triad 2 (with EG(7,9))", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 10
    h: 0.01


quartet_rossby_gravity_influence:
  label: "RH(3,4)+RH(4,5) and WG(3,9)+RH(4,5), both closed by WG(7,9) as the shared sum mode"
  display_label: "Quartet D (WG(7,9)-sum)"
  role: >-
    Novelty-period metric example. Two triads share both a member
    (RH(4,5)) and their own sum mode (WG(7,9)), not a member-member edge.
  h_e: 10000
  modes:
    a: {m: 7, n: 9, alpha: 2, u: 50.0}
    b: {m: 4, n: 5, alpha: 3, u: 80.0}
    c: {m: 3, n: 4, alpha: 3, u: 50.0}
    d: {m: 3, n: 9, alpha: 2, u: 50.0}
  triads:
    - {sum: a, members: [c, b], display_label: "Triad 1 (RH(3,4)+RH(4,5))", triad_key: null}
    - {sum: a, members: [d, b], display_label: "Triad 2 (WG(3,9)+RH(4,5))", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 20
    h: 0.01
  sweep:
    #axes: [{mode: d, min: 0.0, max: 50.0}, {mode: c, min: 0.0, max: 50.0}]
    axes: [{mode: d, min: 0.0, max: 50.0}]
    n_grid: 6
    diagnostics: [novelty_period, p_measure]
  plot:
    title: "Quartet D (WG(7,9)) "
  output: outputs/figures/wave_sets/quartet_rossby_gravity_influence/diagnostics.png


quartet_gravity_wg11:
  label: "RH(4,5)+RH(3,4)+RH(1,2) + westward gravity mode WG(1,1)"
  display_label: "Quartet C (westward variant)"
  role: >-
    Same RH-only triad and topology as quartet_rossby_kelvin (EG(1,1)),
    with the eastward Kelvin mode replaced by its westward counterpart
    WG(1,1) -- one of only two candidates on the RH(4,5)+RH(3,4) edge
    that PASSED a Stage-1 screen (cross-checked FFT/prominence period
    estimators agree within 1pp, the now-deleted
    frequency_shift_catalogue_search.py) as a plausible genuine
    period-shift effect, not a smoothing artifact. Never Stage-2
    quantified (x-sweep + tf-convergence, no saved output), and the
    `frequency_shift` diagnostic that would have quantified it has since
    been removed from the codebase (unused, backed no live paper
    content) -- re-add a period-shift diagnostic first if this candidate
    is revisited. (A third candidate, WG(7,9), was initially reported to
    shift the target's period by 41-45% but that finding was retracted
    2026-08-13: Savitzky-Golay smoothing produced an artifact both
    window-independent estimators put at <=0.1% -- do not re-register
    WG(7,9) for this story without re-deriving the effect from scratch.)
  h_e: 10000
  modes:
    a: {m: 4, n: 5, alpha: 3, u: 30.0}
    b: {m: 3, n: 4, alpha: 3, u: 30.0}
    c: {m: 1, n: 2, alpha: 3, u: 30.0}
    d: {m: 1, n: 1, alpha: 2, u: 0.0}
  triads:
    - {sum: a, members: [b, c], display_label: "Triad 1 (RH-only)", triad_key: null}
    - {sum: a, members: [b, d], display_label: "Triad 2 (with WG(1,1))", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 20
    h: 0.01
  sweep:
    diagnostics: [p_measure]
    n_grid: 10
  output: outputs/figures/wave_sets/quartet_gravity_wg11/diagnostics.png

quartet_dual_gravity_edge:
  label: "WG(1,1)+EG(5,7) edge coupling RH(4,5) and RH(3,4)"
  display_label: "Quartet E"
  role: >-
    Gravity-dominated quartet.
  h_e: 10000
  modes:
    a: {m: 4, n: 5, alpha: 3, u: 50.0}
    b: {m: 1, n: 1, alpha: 2, u: 50.0}
    c: {m: 5, n: 7, alpha: 1, u: 50.0}
    d: {m: 3, n: 4, alpha: 3, u: 50.0}
  triads:
    - {sum: c, members: [a, b], display_label: "Triad 1 (with EG(5,7))", triad_key: null}
    - {sum: a, members: [b, d], display_label: "Triad 2 (with RH(3,4))", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 20
    h: 0.01
  sweep:
    diagnostics: [p_measure]
    n_grid: 10
  output: outputs/figures/wave_sets/quartet_dual_gravity_edge/diagnostics.png

quintet_gravity_star:
  label: "RH(4,5)+RH(1,2)+RH(3,4) with both EG(1,1) and EG(7,9)"
  display_label: "Quintet A"
  role: >-
    Star topology (3 constituent triads sharing the edge RH(4,5)+RH(1,2)),
    matching what five_waves.py's FIVE_WAVES class actually computes. Union of
    Quartet C and Quartet D's gravity modes on the same RH-only triad.
  h_e: 10000
  modes:
    a: {m: 4, n: 5, alpha: 3, u: 30.0}
    b: {m: 3, n: 4, alpha: 3, u: 30.0}
    c: {m: 1, n: 2, alpha: 3, u: 30.0}
    d: {m: 1, n: 1, alpha: 1, u: 0.0}
    e: {m: 7, n: 9, alpha: 1, u: 0.0}
  triads:
    - {sum: a, members: [b, c], display_label: "Triad 1 (RH-only)", triad_key: null}
    - {sum: a, members: [b, d], display_label: "Triad 2 (with EG(1,1))", triad_key: null}
    - {sum: e, members: [a, b], display_label: "Triad 3 (with EG(7,9))", triad_key: null}
  reference_triad: 0
  settings:
    tf_days: 10
    h: 0.01
